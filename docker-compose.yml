# =============================================================================
# Docker Compose для Management System - Root Configuration
# =============================================================================
# Запуск полного стека: make up или docker compose up --build
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: management_db
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      POSTGRES_DB: ${DB_NAME:-management_system}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      # Персистентное хранение данных
      - postgres_data:/var/lib/postgresql/data
      # Инициализационные скрипты (если нужно)
      - ./backend/docker/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-management_system}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - management_network

  # ---------------------------------------------------------------------------
  # Django Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: development
    container_name: management_backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      # Non-secret variables
      - DEBUG=True
      - DJANGO_ENV=development
    volumes:
      # Монтируем код для hot-reload в dev
      - ./backend:/app
      # Игнорируем виртуальное окружение и кэши
      - /app/.venv
      - /app/__pycache__
      # Персистентные директории
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - management_network
    # Для dev используем runserver вместо gunicorn
    command: >
      sh -c "python manage.py runserver 0.0.0.0:8000"

  # ---------------------------------------------------------------------------
  # Frontend (Vite Dev Server)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: development
    container_name: management_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    volumes:
      # Монтируем код для hot-reload
      - .:/app
      # Игнорируем node_modules
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - management_network

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  management_network:
    driver: bridge
