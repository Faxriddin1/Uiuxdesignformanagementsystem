# =============================================================================
# GitHub Actions CI/CD Pipeline
# =============================================================================
# Запускается на: push, pull_request в main/develop
# Проверяет: lint, tests, security, build
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ===========================================================================
  # Backend: Lint, Test, Security
  # ===========================================================================
  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements/development.txt

      - name: 📦 Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: 🔍 Lint with flake8
        run: |
          cd backend
          flake8 apps/ services/ config/ --max-line-length=100 --ignore=E501,W503

      - name: ✨ Check code formatting (black)
        run: |
          cd backend
          black --check apps/ services/ config/

      - name: 📚 Check import sorting (isort)
        run: |
          cd backend
          isort --check apps/ services/ config/

      - name: 🔒 Security check (bandit)
        run: |
          cd backend
          bandit -r apps/ services/ -ll
        continue-on-error: true

      - name: 🧪 Run tests with pytest
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: False
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          cd backend
          pytest --cov=apps --cov-report=xml --cov-report=term

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true

  # ===========================================================================
  # Frontend: Lint, Type Check, Build
  # ===========================================================================
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🔍 Lint (if configured)
        run: npm run lint
        continue-on-error: true

      - name: 🏗️ Build frontend
        run: npm run build

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 7

  # ===========================================================================
  # Docker: Build and Test
  # ===========================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    if: github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: management-system-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Security: Dependency Check
  # ===========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔒 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: 📤 Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # ===========================================================================
  # All Checks Passed
  # ===========================================================================
  all-checks-passed:
    name: ✅ All Checks Passed
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks, docker-build, security-scan]
    if: always()

    steps:
      - name: ✅ Verify all jobs succeeded
        run: |
          if [ "${{ needs.backend-checks.result }}" != "success" ]; then
            echo "❌ Backend checks failed"
            exit 1
          fi
          if [ "${{ needs.frontend-checks.result }}" != "success" ]; then
            echo "❌ Frontend checks failed"
            exit 1
          fi
          if [ "${{ needs.docker-build.result }}" != "success" ] && [ "${{ needs.docker-build.result }}" != "skipped" ]; then
            echo "❌ Docker build failed"
            exit 1
          fi
          echo "✅ All checks passed!"
