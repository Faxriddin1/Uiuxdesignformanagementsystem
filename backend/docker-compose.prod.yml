# =============================================================================
# Docker Compose для Production
# =============================================================================
# Запуск: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Или просто: docker compose -f docker-compose.prod.yml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: management_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-management_system}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT_EXTERNAL:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-management_system}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - management_network

  # ---------------------------------------------------------------------------
  # Redis (для кэширования, Celery, Rate Limiting)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: management_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - management_network

  # ---------------------------------------------------------------------------
  # Django Application (Production)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: production
    container_name: management_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_ENV=production
    volumes:
      # В production НЕ монтируем код - используем только копию в образе
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - management_network
    # Production использует gunicorn из Dockerfile CMD

  # ---------------------------------------------------------------------------
  # Celery Worker (фоновые задачи)
  # ---------------------------------------------------------------------------
  celery:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: production
    container_name: management_celery
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_ENV=production
      - CELERY_BROKER_URL=redis://redis:6379/3
      - CELERY_RESULT_BACKEND=redis://redis:6379/4
    # В production НЕ монтируем volumes
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - management_network
    command: celery -A config worker -l INFO -Q default,notifications,reports,maintenance

  # ---------------------------------------------------------------------------
  # Celery Beat (планировщик задач)
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: production
    container_name: management_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_ENV=production
      - CELERY_BROKER_URL=redis://redis:6379/3
      - CELERY_RESULT_BACKEND=redis://redis:6379/4
    # В production НЕ монтируем volumes
    depends_on:
      - db
      - redis
      - celery
    networks:
      - management_network
    # ВАЖНО: --schedule=/tmp/celerybeat-schedule чтобы избежать проблем с правами
    command: celery -A config beat -l INFO --schedule=/tmp/celerybeat-schedule

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  management_network:
    driver: bridge
