# =============================================================================
# Coverage.py Configuration
# =============================================================================
# Используется командой: pytest --cov
# Или отдельно: coverage run -m pytest && coverage report
# =============================================================================

[coverage:run]
# Исходные директории для анализа
source = apps,services

# Включить анализ ветвлений (branch coverage)
branch = True

# Исключить из анализа
omit = 
    */migrations/*
    */tests/*
    */__pycache__/*
    */admin.py
    config/*
    manage.py
    scripts/*

# Параллельный запуск
parallel = True

[coverage:report]
# Минимальный порог покрытия (%)
fail_under = 70

# Показывать непокрытые строки
show_missing = True

# Исключить покрытые файлы из отчёта
skip_covered = False

# Паттерны для исключения из подсчёта
exclude_lines =
    # Стандартные
    pragma: no cover
    
    # Debug-only code
    def __repr__
    def __str__
    
    # Defensive programming
    raise AssertionError
    raise NotImplementedError
    
    # Type checking imports
    if TYPE_CHECKING:
    if typing.TYPE_CHECKING:
    
    # Abstract methods
    @abstractmethod
    
    # Non-runnable code
    if __name__ == .__main__.:

# Точность отображения
precision = 2

[coverage:html]
# Директория для HTML отчёта
directory = htmlcov

# Заголовок отчёта
title = Management System Coverage Report

[coverage:xml]
# Файл для CI интеграции (Codecov, etc.)
output = coverage.xml

# =============================================================================
# Black Configuration
# =============================================================================

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | migrations
)/
'''

# =============================================================================
# isort Configuration
# =============================================================================

[isort]
profile = black
line_length = 88
skip = .git,.venv,migrations
known_django = django
known_drf = rest_framework
known_first_party = apps,services,config
sections = FUTURE,STDLIB,DJANGO,DRF,THIRDPARTY,FIRSTPARTY,LOCALFOLDER

# =============================================================================
# Flake8 Configuration
# =============================================================================

[flake8]
max-line-length = 88
extend-ignore = E203,W503
exclude =
    .git,
    .venv,
    __pycache__,
    migrations,
    staticfiles,
    media
per-file-ignores =
    __init__.py:F401
    settings/*.py:F403,F405
