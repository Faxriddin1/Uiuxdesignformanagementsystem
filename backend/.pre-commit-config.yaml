# =============================================================================
# Pre-commit hooks configuration
# =============================================================================
# Установка: pre-commit install
# Ручной запуск: pre-commit run --all-files
# =============================================================================

repos:
  # ---------------------------------------------------------------------------
  # Общие проверки
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Удаление trailing whitespace
      - id: end-of-file-fixer
        name: Добавление newline в конец файла
      - id: check-yaml
        name: Проверка YAML синтаксиса
      - id: check-json
        name: Проверка JSON синтаксиса
      - id: check-added-large-files
        name: Проверка больших файлов
        args: ['--maxkb=500']
      - id: check-merge-conflict
        name: Проверка маркеров merge conflict
      - id: debug-statements
        name: Проверка debug statements (print, pdb)
      - id: check-docstring-first
        name: Проверка docstring

  # ---------------------------------------------------------------------------
  # Python formatting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
        name: Black форматирование
        language_version: python3.12

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort сортировка импортов

  # ---------------------------------------------------------------------------
  # Linting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        name: Flake8 линтинг
        additional_dependencies:
          - flake8-bugbear
        args: ['--max-line-length=100', '--ignore=E501,W503']

  # ---------------------------------------------------------------------------
  # Security
  # ---------------------------------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        name: Bandit security check
        args: ['-ll', '--skip=B101']
        exclude: tests/

  # ---------------------------------------------------------------------------
  # Django specific
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: django-check
        name: Django system check
        entry: python manage.py check
        language: system
        types: [python]
        pass_filenames: false
