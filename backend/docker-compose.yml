# =============================================================================
# Docker Compose для Management System
# =============================================================================
# Запуск: docker compose up --build
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database - Единая БД с разделением по схемам
  # ---------------------------------------------------------------------------
  
  db:
    image: postgres:16-alpine
    container_name: management_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-management_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_schemas.sql:/docker-entrypoint-initdb.d/init_schemas.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-management_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - management_network

  # ---------------------------------------------------------------------------
  # Django Application
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: ${ENVIRONMENT:-development}
    container_name: management_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_ENV=${DJANGO_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Монтируем код для hot-reload в dev
      - .:/app
      # Игнорируем виртуальное окружение и кэши
      - /app/.venv
      - /app/__pycache__
      # Персистентные директории
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "${WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - management_network
    # Для dev используем runserver вместо gunicorn
    command: >
      sh -c "python manage.py runserver 0.0.0.0:8000"

  # ---------------------------------------------------------------------------
  # Redis (для кэширования, Celery, Rate Limiting)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: management_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - management_network

  # ---------------------------------------------------------------------------
  # Celery Worker (фоновые задачи)
  # ---------------------------------------------------------------------------
  celery:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: ${ENVIRONMENT:-development}
    container_name: management_celery
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_ENV=${DJANGO_ENV:-development}
      - CELERY_BROKER_URL=redis://redis:6379/3
      - CELERY_RESULT_BACKEND=redis://redis:6379/4
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      - db
      - redis
    networks:
      - management_network
    command: celery -A config worker -l INFO -Q default,notifications,reports,maintenance

  # ---------------------------------------------------------------------------
  # Celery Beat (планировщик задач)
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: ${ENVIRONMENT:-development}
    container_name: management_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DJANGO_ENV=${DJANGO_ENV:-development}
      - CELERY_BROKER_URL=redis://redis:6379/3
      - CELERY_RESULT_BACKEND=redis://redis:6379/4
    volumes:
      - .:/app
      - /app/.venv
    depends_on:
      - db
      - redis
      - celery
    networks:
      - management_network
    # --schedule=/tmp/ предотвращает ошибку Permission denied
    command: celery -A config beat -l INFO --schedule=/tmp/celerybeat-schedule

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  # Единый volume для базы данных
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  redis_data:
    driver: local

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  management_network:
    driver: bridge
