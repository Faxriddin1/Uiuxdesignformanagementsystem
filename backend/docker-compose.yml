# =============================================================================
# Docker Compose для Management System
# =============================================================================
# Запуск: docker compose up --build
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: management_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: management_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # Персистентное хранение данных
      - postgres_data:/var/lib/postgresql/data
      # Инициализационные скрипты (если нужно)
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d management_system"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - management_network

  # ---------------------------------------------------------------------------
  # Django Application
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: development
    container_name: management_web
    restart: unless-stopped
    # Load environment variables from .env file
    env_file:
      - .env
    volumes:
      # Монтируем код для hot-reload в dev
      - .:/app
      # Игнорируем виртуальное окружение и кэши
      - /app/.venv
      - /app/__pycache__
      # Персистентные директории
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - management_network
    # Для dev используем runserver вместо gunicorn
    command: >
      sh -c "python manage.py runserver 0.0.0.0:8000"

  # ---------------------------------------------------------------------------
  # Redis (для кэширования, опционально)
  # ---------------------------------------------------------------------------
  # redis:
  #   image: redis:7-alpine
  #   container_name: management_redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - management_network

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  # redis_data:
  #   driver: local

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  management_network:
    driver: bridge
