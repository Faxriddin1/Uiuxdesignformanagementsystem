# =============================================================================
# Docker Compose для Management System
# =============================================================================
# Запуск: docker compose up --build
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: management_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: management_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # Персистентное хранение данных
      - postgres_data:/var/lib/postgresql/data
      # Инициализационные скрипты (если нужно)
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d management_system"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - management_network

  # ---------------------------------------------------------------------------
  # Django Application
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: development
    container_name: management_web
    restart: unless-stopped
    environment:
      # Django settings
      - DEBUG=True
      - DJANGO_ENV=development
      - SECRET_KEY=django-insecure-dev-key-change-in-production-abc123xyz789
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      # Database
      - DATABASE_URL=postgres://postgres:postgres@db:5432/management_system
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=management_system
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      # CORS
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      - CORS_ALLOW_CREDENTIALS=True
      # JWT
      - JWT_ACCESS_TOKEN_LIFETIME_MINUTES=15
      - JWT_REFRESH_TOKEN_LIFETIME_DAYS=7
      # Seed data
      - CREATE_SEED_DATA=True
      - DEMO_USER_PASSWORD=user123
      - DEMO_ADMIN_PASSWORD=admin123
    volumes:
      # Монтируем код для hot-reload в dev
      - .:/app
      # Игнорируем виртуальное окружение и кэши
      - /app/.venv
      - /app/__pycache__
      # Персистентные директории
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - management_network
    # Для dev используем runserver вместо gunicorn
    command: >
      sh -c "python manage.py runserver 0.0.0.0:8000"

  # ---------------------------------------------------------------------------
  # Redis (для кэширования, опционально)
  # ---------------------------------------------------------------------------
  # redis:
  #   image: redis:7-alpine
  #   container_name: management_redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - management_network

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  # redis_data:
  #   driver: local

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  management_network:
    driver: bridge
